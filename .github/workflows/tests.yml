name: Tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt ruff==0.15.15
      - run: python -m ruff check mrc2cbf.py metadata.py inputs.py tests
      - run: python -m ruff format --check mrc2cbf.py metadata.py inputs.py tests
      - run: python -m unittest discover -s tests -v
